<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" width="1040" height="300" role="img" aria-label="Arthur Honorato — Desenvolvimento, Tecnologia, Projetos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#10161F"/>
      <stop offset="100%" stop-color="#0B1017"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5580A8"/>
      <stop offset="50%" stop-color="#7FB3E0"/>
      <stop offset="100%" stop-color="#5580A8"/>
    </linearGradient>

    <linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7FB3E0" stop-opacity="0"/>
      <stop offset="45%" stop-color="#7FB3E0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7FB3E0" stop-opacity="0"/>
    </linearGradient>

    <!-- malha de pontos: a textura de fundo, discreta -->
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#7FB3E0" fill-opacity="0.11"/>
    </pattern>

    <radialGradient id="vignette" cx="0.3" cy="0.5" r="0.85">
      <stop offset="0%" stop-color="#7FB3E0" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#7FB3E0" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frame"><rect width="1040" height="300" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1040" height="300" fill="url(#bg)"/>
    <rect width="1040" height="300" fill="url(#dots)"/>
    <rect width="1040" height="300" fill="url(#vignette)"/>

    <!-- barra de acento superior, varrendo -->
    <rect x="0" y="0" width="1040" height="3" fill="url(#accent)" opacity="0.55"/>
    <rect x="-300" y="0" width="300" height="3" fill="#BFE0FF" opacity="0.85">
      <animate attributeName="x" values="-300;1040" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- ============ bloco de texto ============
         Corpos maiores do que o "natural" de propósito: no celular o SVG é
         reduzido a ~36% e tudo abaixo de 20px vira ilegível. -->
    <text x="60" y="106" font-family="'Segoe UI Semibold','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="27" font-weight="600" letter-spacing="9" fill="#7FB3E0" fill-opacity="0.92">TUEECODE</text>

    <text x="58" y="186" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="72" font-weight="700" letter-spacing="-1.6" fill="#E6EDF3">Arthur Honorato</text>

    <rect x="60" y="212" width="132" height="3" fill="#7FB3E0" opacity="0.75"/>

    <text x="60" y="256" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="30" fill="#8B949E">
      Desenvolvimento
      <tspan fill="#5580A8" dx="14">•</tspan>
      <tspan dx="14">Tecnologia</tspan>
      <tspan fill="#5580A8" dx="14">•</tspan>
      <tspan dx="14">Projetos</tspan>
    </text>

    <!-- ============ motivo à direita: sinal vital em grade ============ -->
    <g transform="translate(700, 74)" opacity="0.95">
      <rect x="0" y="0" width="286" height="152" rx="11" fill="#0B1017" fill-opacity="0.72"
            stroke="#21262D" stroke-width="1"/>

      <!-- grade interna -->
      <g stroke="#7FB3E0" stroke-opacity="0.08" stroke-width="1">
        <path d="M0 38H286M0 76H286M0 114H286"/>
        <path d="M57 0V152M114 0V152M172 0V152M229 0V152"/>
      </g>

      <!-- traçado do sinal -->
      <path d="M12 98 H54 l11 -26 l12 47 l11 -64 l14 73 l12 -30 h26 l9 -14 l11 23 l12 -40 l14 47 h36 l11 -20 l12 34 l14 -46 h47"
            fill="none" stroke="url(#accent)" stroke-width="2.8"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"
            stroke-dasharray="700" stroke-dashoffset="700">
        <animate attributeName="stroke-dashoffset" values="700;0" dur="3s" fill="freeze"/>
      </path>

      <!-- varredura do cursor -->
      <rect x="0" y="5" width="1.6" height="142" fill="url(#fadeRight)" opacity="0">
        <animate attributeName="x" values="8;276" dur="4.5s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="4.5s" begin="3s" repeatCount="indefinite"/>
      </rect>

      <!-- nós de canto -->
      <g fill="#7FB3E0">
        <circle cx="11" cy="11" r="2.6"/><circle cx="275" cy="11" r="2.6"/>
        <circle cx="11" cy="141" r="2.6"/><circle cx="275" cy="141" r="2.6"/>
      </g>

      <circle cx="266" cy="22" r="3.6" fill="#3FB950">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- moldura -->
    <rect x="0.5" y="0.5" width="1039" height="299" rx="14" fill="none" stroke="#21262D" stroke-width="1"/>
  </g>
</svg>
