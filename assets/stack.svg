<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-label="Painel: camadas de uma aplicação, do cliente ao banco">
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0B1017"/>
    </linearGradient>
    <linearGradient id="s-acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5580A8"/>
      <stop offset="100%" stop-color="#7FB3E0"/>
    </linearGradient>
    <clipPath id="s-frame"><rect width="420" height="260" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#s-frame)">
    <rect width="420" height="260" fill="url(#s-bg)"/>

    <!-- rótulo -->
    <text x="24" y="34" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
          font-size="11" letter-spacing="3.4" fill="#8B949E">ARQUITETURA</text>

    <!-- camadas -->
    <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13">
      <g>
        <rect x="24" y="52" width="372" height="42" rx="8" fill="#161B22" stroke="#21262D"/>
        <circle cx="44" cy="73" r="4" fill="#7FB3E0"/>
        <text x="60" y="78" fill="#E6EDF3">Interface</text>
        <text x="380" y="78" text-anchor="end" fill="#8B949E" font-size="11">React · TypeScript</text>
      </g>
      <g>
        <rect x="24" y="104" width="372" height="42" rx="8" fill="#161B22" stroke="#21262D"/>
        <circle cx="44" cy="125" r="4" fill="#7FB3E0"/>
        <text x="60" y="130" fill="#E6EDF3">Domínio</text>
        <text x="380" y="130" text-anchor="end" fill="#8B949E" font-size="11">serviços · validação</text>
      </g>
      <g>
        <rect x="24" y="156" width="372" height="42" rx="8" fill="#161B22" stroke="#21262D"/>
        <circle cx="44" cy="177" r="4" fill="#7FB3E0"/>
        <text x="60" y="182" fill="#E6EDF3">Repositório</text>
        <text x="380" y="182" text-anchor="end" fill="#8B949E" font-size="11">uma API, dois destinos</text>
      </g>
      <g>
        <rect x="24" y="208" width="372" height="42" rx="8" fill="#161B22" stroke="#21262D"/>
        <circle cx="44" cy="229" r="4" fill="#3FB950"/>
        <text x="60" y="234" fill="#E6EDF3">Postgres</text>
        <text x="380" y="234" text-anchor="end" fill="#8B949E" font-size="11">RLS em toda tabela</text>
      </g>
    </g>

    <!-- pulso descendo pelas camadas -->
    <rect x="24" y="52" width="3" height="42" rx="1.5" fill="url(#s-acc)">
      <animate attributeName="y" values="52;104;156;208;52" dur="4.8s" repeatCount="indefinite"/>
    </rect>

    <rect x="0.5" y="0.5" width="419" height="259" rx="12" fill="none" stroke="#21262D"/>
  </g>
</svg>
